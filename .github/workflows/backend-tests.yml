name: backend-tests

on:
  push:
    branches: [main, master, dx-lab-integration]
  pull_request:
    branches: [main, master, dx-lab-integration]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hub test deps
        run: pip install -r acp_hub/requirements.txt pytest pytest-asyncio httpx pyyaml
      - name: Run wrapper tests
        run: python -m pytest tests/test_acp_hub_wrappers.py -q
