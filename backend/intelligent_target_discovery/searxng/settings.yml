# Minimal SearXNG configuration – works with the agent
use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "abcdefghijklmnopqrstuvwxyz123456"
  base_url: http://localhost:8081

search:
  formats:
    - html
    - json

# No authentication – open instance (agent will use SEARXNG_OPEN=true)