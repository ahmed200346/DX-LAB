# DiscoveryAgent — set your own target (any protein + disease context).
# Usage: conda run -n DiscoveryAgent python run_discovery_agent.py --config pipeline_config.yaml
# Or override without editing:  ... --protein "PD-L1" --disease "melanoma"

run_id: "example_pipeline"
model: "moonshotai/kimi-k2.6"

protein: "EGFR"
disease: "non-small cell lung cancer"

# Pipeline parameters
iterations: 2
num_smiles: 2
run_boltz: false
boltz_top_k: 2
boltz_extra_args_json: '["--use_msa_server","--accelerator","gpu","--num_workers","4"]'
