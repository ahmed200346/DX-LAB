# Same as pipeline_config.yaml but includes selection filters for Boltz.
# Set run_boltz: true when you want structure prediction (slower).
# Usage: conda run -n DiscoveryAgent python run_discovery_agent.py --config pipeline_config_selection.yaml

run_id: "example_selection"
model: "moonshotai/kimi-k2.5"

protein: "EGFR"
disease: "non-small cell lung cancer"

# Pipeline parameters
iterations: 2
num_smiles: 2
run_boltz: false
boltz_top_k: 2
boltz_extra_args_json: '["--use_msa_server","--accelerator","gpu","--num_workers","4"]'

# Candidate selection filters (for Boltz)
min_qed: 0.50
min_pkd: 5.0
