version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes: 
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro   # mount custom config
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081
      - SEARXNG_OPEN=true
      #- SEARXNG_SECRET=your-random-secret-key-here   # optional, but recommended